apply plugin: 'com.android.application'

// Optional dedicated upload key, supplied through a private file OUTSIDE this repository.
// No debug-key fallback. CI/owner release builds must set requireUploadSigning=true.
def signingPath = System.getenv('MUU_SINH_SIGNING_PROPERTIES')
def uploadProperties = new Properties()
def uploadKeyStore = null
if (signingPath) {
    def signingFile = new File(signingPath).canonicalFile
    def repository = rootProject.projectDir.parentFile.canonicalFile.toPath()
    if (!signingFile.isFile() || signingFile.toPath().startsWith(repository)) {
        throw new GradleException('Signing properties must be an existing private file outside the repository.')
    }
    signingFile.withInputStream { uploadProperties.load(it) }
    if (['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].any { !uploadProperties.getProperty(it)?.trim() }) {
        throw new GradleException('Upload signing properties are incomplete.')
    }
    if (!new File(uploadProperties.getProperty('storeFile')).isAbsolute()) {
        throw new GradleException('Upload keystore path must be absolute.')
    }
    uploadKeyStore = new File(uploadProperties.getProperty('storeFile')).canonicalFile
    if (!uploadKeyStore.isAbsolute() || !uploadKeyStore.isFile() || uploadKeyStore.toPath().startsWith(repository)) {
        throw new GradleException('Upload keystore must be an existing private file outside the repository.')
    }
    // Reject the Android debug certificate, not just an alias that can be renamed.
    try {
        def keyStore = java.security.KeyStore.getInstance(uploadProperties.getProperty('storeType', 'JKS'))
        uploadKeyStore.withInputStream { keyStore.load(it, uploadProperties.getProperty('storePassword').toCharArray()) }
        def certificate = keyStore.getCertificate(uploadProperties.getProperty('keyAlias'))
        if (!(certificate instanceof java.security.cert.X509Certificate) ||
            certificate.subjectX500Principal.name.toLowerCase().contains('cn=android debug') ||
            !keyStore.isKeyEntry(uploadProperties.getProperty('keyAlias'))) {
            throw new IllegalStateException()
        }
        certificate.checkValidity()
    } catch (Exception ignored) {
        throw new GradleException('Upload certificate validation failed. A dedicated non-debug upload key is required.')
    }
}

android {
    namespace = "com.muusinh.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.muusinh.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (uploadKeyStore != null) {
            upload {
                storeFile uploadKeyStore
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
                storeType uploadProperties.getProperty('storeType', 'JKS')
            }
        }
    }
    buildTypes {
        release {
            if (uploadKeyStore != null) signingConfig signingConfigs.upload
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

if (providers.gradleProperty('requireUploadSigning').orNull == 'true' && uploadKeyStore == null) {
    throw new GradleException('Upload signing is not configured. Set MUU_SINH_SIGNING_PROPERTIES to a private external properties file.')
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
